version: 2

updates:
  # Keep the pinned action SHAs in the workflow files up to date.
  # Actions are pinned to full commit SHAs (see .github/workflows/*);
  # Dependabot opens PRs to move them to new releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
