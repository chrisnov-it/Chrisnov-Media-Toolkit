name: Build macOS
run-name: Build macOS ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0-beta.3"
        required: true
        default: "0.2.0-beta.3"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: macOS ${{ matrix.arch }} Lite ZIP
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs_on: macos-15 # Pin to a specific macOS image (arm64)
            zip_suffix: macos-arm64
          - arch: x86_64
            runs_on: macos-15-intel # Pin to the Intel image for x86_64
            zip_suffix: macos-x86_64

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_TYPE: LITE
      ZIP_SUFFIX: ${{ matrix.zip_suffix }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      # Pin the macOS deployment target so the app can run on older Intel Macs
      # (e.g. 2015 MacBook Air on Monterey). Without this, building on the
      # Sequoia runner bakes in a newer SDK/Python baseline and the app silently
      # fails to launch on the older macOS.
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # curl_cffi: required for the impersonate option (Instagram/Vimeo
          # private downloads with cookies). Must be installed at build time
          # so PyInstaller bundles it into the executable.
          python -m pip install PySide6 yt-dlp curl_cffi pyinstaller==6.17.0 --only-binary=:all:

      - name: Prepare build metadata
        run: |
          VERSION="${APP_VERSION_RAW#v}"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build unsigned macOS app
        run: |
          pyinstaller chrisnov-media-toolkit.spec

      - name: Package app as ZIP
        run: |
          ZIP_NAME="chrisnov-media-toolkit-v${APP_VERSION}-${ZIP_SUFFIX}-lite.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Chrisnov Media Toolkit.app" "dist/${ZIP_NAME}"
          (cd dist && shasum -a 256 "${ZIP_NAME}") > "dist/${ZIP_NAME}.sha256"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-${{ matrix.zip_suffix }}-lite
          path: |
            dist/chrisnov-media-toolkit-v*-${{ matrix.zip_suffix }}-lite.zip
            dist/chrisnov-media-toolkit-v*-${{ matrix.zip_suffix }}-lite.zip.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release and Upload
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Normalize version tag
        shell: bash
        run: |
          RAW="${APP_VERSION_RAW}"
          if [[ "$RAW" != v* ]]; then RAW="v$RAW"; fi
          echo "TAG_NAME=$RAW" >> "$GITHUB_ENV"
          echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts/
          merge-multiple: true

      - name: Prepare release metadata
        id: prep
        run: |
          awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Chrisnov Media Toolkit v${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
            artifacts/**/*.app
            artifacts/**/*.dmg
          fail_on_unmatched_files: false

      - name: Ensure release notes are set
        # The three release jobs race on one tag and softprops can drop
        # the body during that race; re-set it explicitly after the upload.
        run: gh release edit "$TAG_NAME" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      # R2 upload has been removed - all assets are now distributed
      # via GitHub Releases. See README.md for download URLs.