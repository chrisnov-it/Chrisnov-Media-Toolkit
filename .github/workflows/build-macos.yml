name: Build macOS
run-name: Build macOS ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0-beta.2"
        required: true
        default: "0.2.0-beta.2"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: macOS ${{ matrix.arch }} Lite ZIP
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs_on: macos-15 # Pin to a specific macOS image (arm64)
            zip_suffix: macos-arm64
          - arch: x86_64
            runs_on: macos-15-intel # Pin to the Intel image for x86_64
            zip_suffix: macos-x86_64

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_TYPE: LITE
      ZIP_SUFFIX: ${{ matrix.zip_suffix }}
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 yt-dlp pyinstaller==6.17.0 awscli --only-binary=:all:

      - name: Prepare build metadata
        run: |
          VERSION="${APP_VERSION_RAW#v}"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build unsigned macOS app
        run: |
          pyinstaller chrisnov-media-toolkit.spec

      - name: Package app as ZIP
        run: |
          ZIP_NAME="chrisnov-media-toolkit-v${APP_VERSION}-${ZIP_SUFFIX}-lite.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Chrisnov Media Toolkit.app" "dist/${ZIP_NAME}"
          (cd dist && shasum -a 256 "${ZIP_NAME}") > "dist/${ZIP_NAME}.sha256"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.zip_suffix }}-lite
          path: |
            dist/chrisnov-media-toolkit-v*-${{ matrix.zip_suffix }}-lite.zip
            dist/chrisnov-media-toolkit-v*-${{ matrix.zip_suffix }}-lite.zip.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release and Upload
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Normalize version tag
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "$RAW" != v* ]]; then RAW="v$RAW"; fi
          echo "TAG_NAME=$RAW" >> "$GITHUB_ENV"
          echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/
          merge-multiple: true

      - name: Prepare release metadata
        id: prep
        run: |
          VERSION="${{ env.VERSION }}"
          awk -v ver="$VERSION" '/^## \['"$ver"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Chrisnov Media Toolkit v${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
            artifacts/**/*.app
            artifacts/**/*.dmg
          fail_on_unmatched_files: false

      # R2 upload has been removed - all assets are now distributed
      # via GitHub Releases. See README.md for download URLs.