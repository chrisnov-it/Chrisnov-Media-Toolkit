name: Build macOS
run-name: Build macOS ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0-beta.4"
        required: true
        default: "0.2.0-beta.4"
  push:
    tags:
      - "v*"

# Default token access for every job (the release job overrides it with
# contents: write, which is what it needs to create the release).
permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }} Lite ZIP
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs_on: macos-15 # Pin to a specific macOS image (arm64)
            zip_suffix: macos-arm64
          - arch: x86_64
            runs_on: macos-15-intel # Pin to the Intel image for x86_64
            zip_suffix: macos-x86_64

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_TYPE: LITE
      ZIP_SUFFIX: ${{ matrix.zip_suffix }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      # Pin the macOS deployment target so the app can run on older Intel Macs
      # (e.g. 2015 MacBook Air on Monterey). Without this, building on the
      # Sequoia runner bakes in a newer SDK/Python baseline and the app silently
      # fails to launch on the older macOS.
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps from requirements.txt: release builds must resolve
          # exactly the pinned versions the CI test job validated (yt-dlp,
          # PySide6, curl_cffi). curl_cffi is required for the impersonate
          # option (Instagram/Vimeo private downloads with cookies) and must
          # be installed at build time so PyInstaller bundles it. The wheel
          # requirement keeps the macOS build from compiling anything.
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: pyinstaller==6.17.0

      - name: Prepare build metadata
        run: |
          set -euo pipefail
          VERSION="${APP_VERSION_RAW#v}"
          # Validate before it lands in GITHUB_ENV (a newline in it would
          # inject extra variables) and in artifact names / version_info.txt.
          if [[ ! "$VERSION" =~ ^[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::Unsupported version: $VERSION"
            exit 1
          fi
          printf 'APP_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'APP_BUILD_NUMBER=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build unsigned macOS app
        run: |
          pyinstaller chrisnov-media-toolkit.spec

      - name: Package app as ZIP
        run: |
          ZIP_NAME="chrisnov-media-toolkit-v${APP_VERSION}-${ZIP_SUFFIX}-lite.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Chrisnov Media Toolkit.app" "dist/${ZIP_NAME}"
          (cd dist && shasum -a 256 "${ZIP_NAME}") > "dist/${ZIP_NAME}.sha256"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.zip_suffix }}-lite
          path: |
            dist/chrisnov-media-toolkit-v*-${{ matrix.zip_suffix }}-lite.zip
            dist/chrisnov-media-toolkit-v*-${{ matrix.zip_suffix }}-lite.zip.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release and Upload
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize version tag
        shell: bash
        run: |
          set -euo pipefail
          RAW="${APP_VERSION_RAW}"
          # Reject anything but a plain version/tag before it is written to
          # GITHUB_ENV (a newline in it would inject extra variables) and
          # used as the release tag name.
          if [[ ! "$RAW" =~ ^v?[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::Unsupported version/tag: $RAW"
            exit 1
          fi
          if [[ "$RAW" != v* ]]; then RAW="v$RAW"; fi
          printf 'TAG_NAME=%s\n' "$RAW" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "${RAW#v}" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true

      - name: Prepare release metadata
        id: prep
        run: |
          set -euo pipefail
          # The version is passed with -v instead of being spliced into the
          # awk program text: the old '/^## \['"$VERSION"'\]/' form let a
          # crafted tag inject awk code between the literals.
          awk -v ver="$VERSION" \
            'index($0, "## [" ver "]") == 1 {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > release_notes.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Chrisnov Media Toolkit v${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
            artifacts/**/*.app
            artifacts/**/*.dmg
          fail_on_unmatched_files: false

      - name: Ensure release notes are set
        # The three release jobs race on one tag and softprops can drop
        # the body during that race; re-set it explicitly after the upload.
        run: gh release edit "$TAG_NAME" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      # R2 upload has been removed - all assets are now distributed
      # via GitHub Releases. See README.md for download URLs.