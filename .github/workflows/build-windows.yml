name: Build Windows
run-name: Build Windows ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-beta.1"
        required: true
        default: "0.1.0-beta.2"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Windows x64 Lite and Bundled EXE
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_TYPE: LITE

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install PySide6 yt-dlp pyinstaller awscli

      - name: Prepare build metadata
        shell: pwsh
        run: |
          $version = "${env:APP_VERSION_RAW}".TrimStart("v")
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows Lite and Bundled executables
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build-windows.ps1 -Type Both

      - name: Package versioned executables and ZIPs
        shell: pwsh
        run: |
          $liteName    = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-lite.exe"
          $bundledName = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-bundled.exe"
          $liteZip     = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-lite.zip"
          $bundledZip  = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-bundled.zip"

          # Rename bare executables
          Copy-Item -LiteralPath "dist\chrisnov-media-toolkit-lite.exe"    -Destination "dist\$liteName"    -Force
          Copy-Item -LiteralPath "dist\chrisnov-media-toolkit-bundled.exe" -Destination "dist\$bundledName" -Force

          # Wrap each exe in a zip (Chrome won't block a zip download)
          Compress-Archive -Path "dist\$liteName"    -DestinationPath "dist\$liteZip"    -Force
          Compress-Archive -Path "dist\$bundledName" -DestinationPath "dist\$bundledZip" -Force

          # SHA256 for zips (primary download files)
          (Get-FileHash -Algorithm SHA256 "dist\$liteZip").Hash    | Set-Content -Path "dist\$liteZip.sha256"
          (Get-FileHash -Algorithm SHA256 "dist\$bundledZip").Hash | Set-Content -Path "dist\$bundledZip.sha256"

          "LITE_NAME=$liteName"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUNDLED_NAME=$bundledName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LITE_ZIP=$liteZip"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUNDLED_ZIP=$bundledZip"   | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Submit Windows binaries to VirusTotal
        id: vt
        if: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          # VirusTotal free tier caps file size at 650 MB. The Bundled variant
          # bundles FFmpeg+FFprobe and easily crosses that limit, so we skip
          # it gracefully. Lite ships without FFmpeg so it almost always fits.
          $VT_MAX_BYTES = 650MB
          foreach ($name in @($env:LITE_NAME, $env:BUNDLED_NAME)) {
            $path = Join-Path "dist" $name
            if (-not (Test-Path $path)) {
              Write-Host "::warning::$name not found at $path — skipping VirusTotal submission"
              continue
            }
            $size = (Get-Item $path).Length
            if ($size -gt $VT_MAX_BYTES) {
              $sizeMb = [math]::Round($size / 1MB, 1)
              Write-Host "::warning::$name is ${sizeMb} MB which exceeds VirusTotal's 650 MB limit — skipping"
              continue
            }
            try {
              Write-Host "Uploading $name to VirusTotal..."
              $form = @{ file = Get-Item $path }
              $resp = Invoke-RestMethod `
                -Uri 'https://www.virustotal.com/api/v3/files' `
                -Method Post `
                -Headers @{ 'x-apikey' = $VT_API_KEY } `
                -Form $form `
                -TimeoutSec 180
              $analysisId = $resp.data.id
              $analysisUrl = "https://www.virustotal.com/gui/file/$analysisId"
              Write-Host "Submitted $name — $analysisUrl"
              "$name|$analysisUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            } catch {
              Write-Host "::warning::VirusTotal submission failed for ${name}: $_"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: chrisnov-media-toolkit-windows-x64
          path: |
            dist/chrisnov-media-toolkit-v*-windows-x64-lite.zip
            dist/chrisnov-media-toolkit-v*-windows-x64-lite.zip.sha256
            dist/chrisnov-media-toolkit-v*-windows-x64-bundled.zip
            dist/chrisnov-media-toolkit-v*-windows-x64-bundled.zip.sha256
          if-no-files-found: error

      - name: Upload to Cloudflare R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $endpoint = "https://${env:R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          $scripts = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts"
          $env:PATH = "$scripts;$env:PATH"
          $aws = (Get-Command aws -ErrorAction Stop).Source

          & $aws s3 cp "dist\${env:LITE_ZIP}"         "s3://${env:R2_BUCKET}/app/windows/${env:LITE_ZIP}"         --endpoint-url $endpoint
          & $aws s3 cp "dist\${env:LITE_ZIP}.sha256"  "s3://${env:R2_BUCKET}/app/windows/${env:LITE_ZIP}.sha256"  --endpoint-url $endpoint
          & $aws s3 cp "dist\${env:BUNDLED_ZIP}"        "s3://${env:R2_BUCKET}/app/windows/${env:BUNDLED_ZIP}"        --endpoint-url $endpoint
          & $aws s3 cp "dist\${env:BUNDLED_ZIP}.sha256" "s3://${env:R2_BUCKET}/app/windows/${env:BUNDLED_ZIP}.sha256" --endpoint-url $endpoint
