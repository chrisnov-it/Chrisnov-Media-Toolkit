name: Build Windows
run-name: Build Windows ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0-beta.4"
        required: true
        default: "0.2.0-beta.4"
  push:
    tags:
      - "v*"

# Default token access for every job (the release job overrides it with
# contents: write, which is what it needs to create the release).
permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Lite and Bundled EXE
    runs-on: windows-2022 # Pin to a specific version for stability
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_TYPE: LITE

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          # Runtime deps from requirements.txt: release builds must resolve
          # exactly the pinned versions the CI test job validated (yt-dlp,
          # PySide6, curl_cffi). curl_cffi is required for the impersonate
          # option (Instagram/Vimeo private downloads with cookies) and must
          # be installed at build time so PyInstaller bundles it.
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller==6.17.0

      - name: Prepare build metadata
        shell: pwsh
        run: |
          $version = "$($env:APP_VERSION_RAW)".TrimStart("v")
          # Validate before the value is written to GITHUB_ENV (a newline in
          # it would inject extra variables) and reused in artifact names and
          # version_info.txt.
          if ($version -notmatch '^[0-9][0-9A-Za-z._+-]*$') {
            Write-Host "::error::Unsupported version: $version"
            exit 1
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows Lite and Bundled executables
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build-windows.ps1 -Type Both

      - name: Package versioned executables and ZIPs
        shell: pwsh
        run: |
          $liteName    = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-lite.exe"
          $bundledName = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-bundled.exe"
          $liteZip     = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-lite.zip"
          $bundledZip  = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-bundled.zip"

          # Rename bare executables
          Copy-Item -LiteralPath "dist\chrisnov-media-toolkit-lite.exe"    -Destination "dist\$liteName"    -Force
          Copy-Item -LiteralPath "dist\chrisnov-media-toolkit-bundled.exe" -Destination "dist\$bundledName" -Force

          # Wrap each exe in a zip (Chrome won't block a zip download). The
          # bundled zip also carries FFmpeg's licence text when the build
          # produced one - GPL redistribution requirement, see docs/THIRD-PARTY.md
          Compress-Archive -Path "dist\$liteName"    -DestinationPath "dist\$liteZip"    -Force
          $bundledPayload = @("dist\$bundledName")
          if (Test-Path "bin\FFMPEG-LICENSE.txt") { $bundledPayload += "bin\FFMPEG-LICENSE.txt" }
          Compress-Archive -Path $bundledPayload -DestinationPath "dist\$bundledZip" -Force

          # SHA256 for zips (primary download files). Same "hash  filename"
          # layout that sha256sum/shasum write for the tarball and macOS zips,
          # so `sha256sum -c *.sha256` (git-bash, WSL, Linux) verifies these
          # the same way — a bare hash alone is not checkable with -c.
          $liteHash    = (Get-FileHash -Algorithm SHA256 "dist\$liteZip").Hash
          $bundledHash = (Get-FileHash -Algorithm SHA256 "dist\$bundledZip").Hash
          "$liteHash  $liteZip"       | Set-Content -Path "dist\$liteZip.sha256"
          "$bundledHash  $bundledZip" | Set-Content -Path "dist\$bundledZip.sha256"

          "LITE_NAME=$liteName"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUNDLED_NAME=$bundledName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LITE_ZIP=$liteZip"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUNDLED_ZIP=$bundledZip"   | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrisnov-media-toolkit-windows-x64
          path: |
            dist/chrisnov-media-toolkit-v*-windows-x64-lite.zip
            dist/chrisnov-media-toolkit-v*-windows-x64-lite.zip.sha256
            dist/chrisnov-media-toolkit-v*-windows-x64-bundled.zip
            dist/chrisnov-media-toolkit-v*-windows-x64-bundled.zip.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release and Upload
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize version tag
        shell: bash
        run: |
          set -euo pipefail
          RAW="${APP_VERSION_RAW}"
          # Reject anything but a plain version/tag before it is written to
          # GITHUB_ENV (a newline in it would inject extra variables) and
          # used as the release tag name.
          if [[ ! "$RAW" =~ ^v?[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::Unsupported version/tag: $RAW"
            exit 1
          fi
          if [[ "$RAW" != v* ]]; then RAW="v$RAW"; fi
          printf 'TAG_NAME=%s\n' "$RAW" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "${RAW#v}" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
          pattern: chrisnov-media-toolkit-*
          merge-multiple: true

      - name: Prepare release metadata
        id: prep
        run: |
          set -euo pipefail
          # The version is passed with -v instead of being spliced into the
          # awk program text: the old '/^## \['"$VERSION"'\]/' form let a
          # crafted tag inject awk code between the literals.
          awk -v ver="$VERSION" \
            'index($0, "## [" ver "]") == 1 {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > release_notes.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Chrisnov Media Toolkit v${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
            artifacts/**/*.exe
          fail_on_unmatched_files: false

      - name: Ensure release notes are set
        # The three release jobs race on one tag and softprops can drop
        # the body during that race; re-set it explicitly after the upload.
        run: gh release edit "$TAG_NAME" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      # R2 upload has been removed - all assets are now distributed
      # via GitHub Releases. See README.md for download URLs.
