name: Build Windows
run-name: Build Windows ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-beta.1"
        required: true
        default: "0.1.0-beta.4"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Windows x64 Lite and Bundled EXE
    runs-on: windows-2022 # Pin to a specific version for stability
    timeout-minutes: 30

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_TYPE: LITE

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install PySide6 yt-dlp pyinstaller==6.17.0 awscli

      - name: Prepare build metadata
        shell: pwsh
        run: |
          $version = "${env:APP_VERSION_RAW}".TrimStart("v")
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows Lite and Bundled executables
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build-windows.ps1 -Type Both

      - name: Package versioned executables and ZIPs
        shell: pwsh
        run: |
          $liteName    = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-lite.exe"
          $bundledName = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-bundled.exe"
          $liteZip     = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-lite.zip"
          $bundledZip  = "chrisnov-media-toolkit-v${env:APP_VERSION}-windows-x64-bundled.zip"

          # Rename bare executables
          Copy-Item -LiteralPath "dist\chrisnov-media-toolkit-lite.exe"    -Destination "dist\$liteName"    -Force
          Copy-Item -LiteralPath "dist\chrisnov-media-toolkit-bundled.exe" -Destination "dist\$bundledName" -Force

          # Wrap each exe in a zip (Chrome won't block a zip download)
          Compress-Archive -Path "dist\$liteName"    -DestinationPath "dist\$liteZip"    -Force
          Compress-Archive -Path "dist\$bundledName" -DestinationPath "dist\$bundledZip" -Force

          # SHA256 for zips (primary download files)
          (Get-FileHash -Algorithm SHA256 "dist\$liteZip").Hash    | Set-Content -Path "dist\$liteZip.sha256"
          (Get-FileHash -Algorithm SHA256 "dist\$bundledZip").Hash | Set-Content -Path "dist\$bundledZip.sha256"

          "LITE_NAME=$liteName"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUNDLED_NAME=$bundledName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LITE_ZIP=$liteZip"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUNDLED_ZIP=$bundledZip"   | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: chrisnov-media-toolkit-windows-x64
          path: |
            dist/chrisnov-media-toolkit-v*-windows-x64-lite.zip
            dist/chrisnov-media-toolkit-v*-windows-x64-lite.zip.sha256
            dist/chrisnov-media-toolkit-v*-windows-x64-bundled.zip
            dist/chrisnov-media-toolkit-v*-windows-x64-bundled.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release and Upload
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Normalize version tag
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "$RAW" != v* ]]; then RAW="v$RAW"; fi
          echo "TAG_NAME=$RAW" >> "$GITHUB_ENV"
          echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/
          pattern: chrisnov-media-toolkit-*
          merge-multiple: true

      - name: Prepare release metadata
        id: prep
        run: |
          awk -v ver="${{ env.VERSION }}" '/^## \['"$ver"']/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Chrisnov Media Toolkit v${{ env.VERSION }}
          body_path: release_notes.md
          files: artifacts/*
          fail_on_unmatched_files: true

      - name: Upload all artifacts to Cloudflare R2
        if: env.R2_ACCOUNT_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          for file in artifacts/*; do
            filename=$(basename "$file")
            if [[ "$filename" == *"-windows-"* ]]; then
              aws s3 cp "$file" "s3://${R2_BUCKET}/app/windows/$filename" --endpoint-url "${ENDPOINT}"
            elif [[ "$filename" == *"-linux-"* ]]; then
              aws s3 cp "$file" "s3://${R2_BUCKET}/app/linux/$filename" --endpoint-url "${ENDPOINT}"
            elif [[ "$filename" == *"-macos-"* ]]; then
              aws s3 cp "$file" "s3://${R2_BUCKET}/app/macos/$filename" --endpoint-url "${ENDPOINT}"
            fi
          done
