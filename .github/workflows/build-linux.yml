name: Build Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-beta.1"
        required: true
        default: "0.1.0-beta.1"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Linux x64 Lite TAR
    runs-on: ubuntu-latest

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_TYPE: LITE

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 yt-dlp pyinstaller awscli

      - name: Prepare build metadata
        run: |
          VERSION="${APP_VERSION_RAW#v}"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build Linux binary
        run: |
          pyinstaller chrisnov-media-toolkit.spec

      - name: Package binary as TAR
        run: |
          TAR_NAME="chrisnov-media-toolkit-v${APP_VERSION}-linux-x64-lite.tar.gz"
          tar -C dist -czf "dist/${TAR_NAME}" chrisnov-media-toolkit-lite
          sha256sum "dist/${TAR_NAME}" > "dist/${TAR_NAME}.sha256"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: |
            dist/${{ env.TAR_NAME }}
            dist/${{ env.TAR_NAME }}.sha256
          if-no-files-found: error

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "dist/${TAR_NAME}" "s3://${R2_BUCKET}/app/linux/${TAR_NAME}" --endpoint-url "${ENDPOINT}"
          aws s3 cp "dist/${TAR_NAME}.sha256" "s3://${R2_BUCKET}/app/linux/${TAR_NAME}.sha256" --endpoint-url "${ENDPOINT}"
