name: Build Linux
run-name: Build Linux ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-beta.1"
        required: true
        default: "0.1.0-beta.4"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Linux x64 Lite TAR
    runs-on: ubuntu-22.04 # Pin to a specific LTS version for stability
    timeout-minutes: 30

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_TYPE: LITE

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 yt-dlp pyinstaller==6.17.0 awscli

      - name: Prepare build metadata
        run: |
          VERSION="${APP_VERSION_RAW#v}"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build Linux binary
        run: |
          pyinstaller chrisnov-media-toolkit.spec

      - name: Package binary as TAR
        run: |
          TAR_NAME="chrisnov-media-toolkit-v${APP_VERSION}-linux-x64-lite.tar.gz"
          tar -C dist -czf "dist/${TAR_NAME}" chrisnov-media-toolkit-lite
          (cd dist && sha256sum "${TAR_NAME}") > "dist/${TAR_NAME}.sha256"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-lite
          path: |
            dist/chrisnov-media-toolkit-v*-linux-x64-lite.tar.gz
            dist/chrisnov-media-toolkit-v*-linux-x64-lite.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release and Upload
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Normalize version tag
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "$RAW" != v* ]]; then RAW="v$RAW"; fi
          echo "TAG_NAME=$RAW" >> "$GITHUB_ENV"
          echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/
          merge-multiple: true

      - name: Prepare release metadata
        id: prep
        run: |
          VERSION="${{ env.VERSION }}"
          awk -v ver="$VERSION" '/^## \['"$ver"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Chrisnov Media Toolkit v${{ env.VERSION }}
          body_path: release_notes.md
          files: artifacts/*/*
          fail_on_unmatched_files: true

      - name: Upload all artifacts to Cloudflare R2
        if: env.R2_ACCOUNT_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          for file in artifacts/*; do
            filename=$(basename "$file")
            if [[ "$filename" == *"-windows-"* ]]; then
              aws s3 cp "$file" "s3://${R2_BUCKET}/app/windows/$filename" --endpoint-url "${ENDPOINT}"
            elif [[ "$filename" == *"-linux-"* ]]; then
              aws s3 cp "$file" "s3://${R2_BUCKET}/app/linux/$filename" --endpoint-url "${ENDPOINT}"
            elif [[ "$filename" == *"-macos-"* ]]; then
              aws s3 cp "$file" "s3://${R2_BUCKET}/app/macos/$filename" --endpoint-url "${ENDPOINT}"
            fi
          done