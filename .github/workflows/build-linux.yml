name: Build Linux
run-name: Build Linux ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0-beta.3"
        required: true
        default: "0.2.0-beta.3"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Linux x64 Lite TAR
    runs-on: ubuntu-22.04 # Pin to a specific LTS version for stability
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
      BUILD_TYPE: LITE

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # curl_cffi: required for the impersonate option (Instagram/Vimeo
          # private downloads with cookies). Must be installed at build time
          # so PyInstaller bundles it into the executable.
          python -m pip install PySide6 yt-dlp curl_cffi pyinstaller==6.17.0

      - name: Prepare build metadata
        run: |
          VERSION="${APP_VERSION_RAW#v}"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build Linux binary
        run: |
          pyinstaller chrisnov-media-toolkit.spec

      - name: Package binary as TAR
        run: |
          TAR_NAME="chrisnov-media-toolkit-v${APP_VERSION}-linux-x64-lite.tar.gz"
          tar -C dist -czf "dist/${TAR_NAME}" chrisnov-media-toolkit-lite
          (cd dist && sha256sum "${TAR_NAME}") > "dist/${TAR_NAME}.sha256"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-lite
          path: |
            dist/chrisnov-media-toolkit-v*-linux-x64-lite.tar.gz
            dist/chrisnov-media-toolkit-v*-linux-x64-lite.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release and Upload
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    env:
      APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Normalize version tag
        shell: bash
        run: |
          RAW="${APP_VERSION_RAW}"
          if [[ "$RAW" != v* ]]; then RAW="v$RAW"; fi
          echo "TAG_NAME=$RAW" >> "$GITHUB_ENV"
          echo "VERSION=${RAW#v}" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts/
          merge-multiple: true

      - name: Prepare release metadata
        id: prep
        run: |
          awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Chrisnov Media Toolkit v${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
            artifacts/**/*.exe
          fail_on_unmatched_files: false

      - name: Ensure release notes are set
        # The three release jobs race on one tag and softprops can drop
        # the body during that race; re-set it explicitly after the upload.
        run: gh release edit "$TAG_NAME" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      # R2 upload has been removed - all assets are now distributed
      # via GitHub Releases. See README.md for download URLs.