name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows runs on purpose: Path.home()/ntpath and the PyInstaller
        # binary lookups behave differently there, and a Linux-only job
        # silently accepted a test that only passed on Linux.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Run pytest
        run: pytest -v

      - name: Run offscreen GUI smoke test
        run: python scripts/smoke_gui.py

      - name: Assert the smoke test never touched a real user config
        # scripts/smoke_gui.py redirects HOME/XDG_CONFIG_HOME/USERPROFILE to a
        # temp dir. If that isolation regresses, the run would append to - and
        # at the end clear - the developer's real download history.
        run: >-
          python -c "import os, pathlib, sys;
          p = pathlib.Path(os.environ.get('USERPROFILE') or pathlib.Path.home()) / '.config' / 'chrisnov-media-toolkit';
          sys.exit(f'smoke test polluted {p}' if p.exists() else 0)"
